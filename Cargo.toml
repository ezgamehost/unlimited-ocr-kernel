[package]
name = "uocr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CPU inference kernels and runtime for Unlimited-OCR"

[dependencies]
half = "2.6"
libm = "0.2"
memmap2 = "0.9"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
